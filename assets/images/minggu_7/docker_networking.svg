<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title    { font-size: 22px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .header   { font-size: 15px; font-weight: 700; fill: #111827; }
    .boxtitle { font-size: 14px; font-weight: 700; }
    .boxsub   { font-size: 11px; }
    .netlabel { font-size: 13px; font-weight: 700; }
    .netsub   { font-size: 10.5px; }
    .arrlabel { font-size: 12px; font-weight: 700; fill: #374151; }
    .arrsub   { font-size: 10.5px; fill: #4B5563; }
    .callout-title { font-size: 13px; font-weight: 700; }
    .callout-body  { font-size: 12px; fill: #1F2937; }
    .foot     { font-size: 12px; fill: #6B7280; }
    .xmark    { font-size: 20px; font-weight: 700; fill: #DC2626; }
  </style>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="440" fill="#FFFFFF"/>

  <text x="470" y="28" text-anchor="middle" class="title">Docker Networking: Bridge Network</text>
  <text x="470" y="48" text-anchor="middle" class="subtitle">Ilustrasi arsitektur — Minggu 7, Hari 4</text>

  <!-- Column headers -->
  <text x="250" y="85" text-anchor="middle" class="header">Tanpa Network Khusus (docker run terpisah)</text>
  <text x="690" y="85" text-anchor="middle" class="header">Dengan Compose (bridge network otomatis)</text>

  <!-- ===================== LEFT: isolated containers ===================== -->
  <rect x="70" y="170" width="160" height="90" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="150" y="205" text-anchor="middle" class="boxtitle" fill="#1E3A8A">Container A</text>
  <text x="150" y="225" text-anchor="middle" class="boxsub" fill="#1E3A8A">(docker run)</text>

  <rect x="270" y="170" width="160" height="90" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="350" y="205" text-anchor="middle" class="boxtitle" fill="#1E3A8A">Container B</text>
  <text x="350" y="225" text-anchor="middle" class="boxsub" fill="#1E3A8A">(docker run)</text>

  <line x1="230" y1="215" x2="270" y2="215" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="250" y="222" text-anchor="middle" class="xmark">✕</text>

  <!-- ===================== RIGHT: bridge network ===================== -->
  <rect x="500" y="100" width="380" height="190" rx="10" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
  <text x="690" y="125" text-anchor="middle" class="netlabel" fill="#78350F">bridge network</text>
  <text x="690" y="143" text-anchor="middle" class="netsub" fill="#78350F">(dibuat otomatis oleh Docker Compose)</text>

  <rect x="520" y="170" width="140" height="90" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="590" y="205" text-anchor="middle" class="boxtitle" fill="#1E3A8A">svc-A</text>
  <text x="590" y="225" text-anchor="middle" class="boxsub" fill="#1E3A8A">(nama service)</text>

  <rect x="720" y="170" width="140" height="90" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="790" y="205" text-anchor="middle" class="boxtitle" fill="#1E3A8A">svc-B</text>
  <text x="790" y="225" text-anchor="middle" class="boxsub" fill="#1E3A8A">(nama service)</text>

  <line x1="660" y1="215" x2="720" y2="215" stroke="#374151" stroke-width="2" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="690" y="200" text-anchor="middle" class="arrlabel">DNS internal</text>
  <text x="690" y="245" text-anchor="middle" class="arrsub">(resolve by</text>
  <text x="690" y="258" text-anchor="middle" class="arrsub">nama)</text>

  <!-- ===================== Callouts ===================== -->
  <rect x="40" y="300" width="420" height="95" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="40" y="300" width="6" height="95" fill="#DC2626"/>
  <text x="56" y="322" class="callout-title" fill="#7F1D1D">Tidak saling kenal secara default</text>
  <text x="56" y="342" class="callout-body">Perlu docker network connect manual</text>
  <text x="56" y="359" class="callout-body">supaya container bisa saling ping</text>
  <text x="56" y="376" class="callout-body">pakai nama masing-masing.</text>

  <rect x="480" y="300" width="420" height="95" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <rect x="480" y="300" width="6" height="95" fill="#D97706"/>
  <text x="496" y="322" class="callout-title" fill="#78350F">Saling kenal otomatis lewat nama service</text>
  <text x="496" y="342" class="callout-body">Compose otomatis membuat 1 bridge network</text>
  <text x="496" y="359" class="callout-body">per project — DNS internal resolve nama</text>
  <text x="496" y="376" class="callout-body">service ke IP container yang benar.</text>

  <text x="470" y="415" text-anchor="middle" class="foot">Contoh nyata: pg-belajar (docker run standalone) TIDAK otomatis join bridge network Airflow → perlu host.docker.internal</text>
</svg>
