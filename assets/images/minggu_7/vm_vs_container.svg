<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title   { font-size: 22px; font-weight: 700; fill: #111827; }
    .subtitle{ font-size: 14px; fill: #6B7280; }
    .header  { font-size: 19px; font-weight: 700; fill: #111827; }
    .layer   { font-size: 14px; font-weight: 600; }
    .sub     { font-size: 13px; font-weight: 600; }
    .small   { font-size: 12px; }
    .callout-title { font-size: 13.5px; font-weight: 700; }
    .callout-body  { font-size: 12.5px; fill: #1F2937; }
    .foot    { font-size: 12px; fill: #6B7280; }
  </style>

  <rect x="0" y="0" width="940" height="700" fill="#FFFFFF"/>

  <text x="470" y="32" text-anchor="middle" class="title">Container vs Virtual Machine: Apa yang Di-virtualisasi?</text>
  <text x="470" y="54" text-anchor="middle" class="subtitle">Ilustrasi arsitektur — Minggu 7, Hari 1</text>

  <!-- Column headers -->
  <text x="240" y="90" text-anchor="middle" class="header">Virtual Machine</text>
  <text x="680" y="90" text-anchor="middle" class="header">Container</text>

  <!-- ===================== LEFT: VM ===================== -->
  <!-- No-guest-os equivalent zone not needed on VM side (full guest OS) -->
  <!-- App / Bins / Guest OS split into VM1 / VM2 -->
  <g>
    <!-- VM1 -->
    <rect x="40" y="110" width="195" height="60" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="137" y="145" text-anchor="middle" class="sub" fill="#1E3A8A">App A</text>

    <rect x="40" y="170" width="195" height="60" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="137" y="205" text-anchor="middle" class="sub" fill="#065F46">Bins / Libs</text>

    <rect x="40" y="230" width="195" height="180" rx="6" fill="#FED7AA" stroke="#F97316" stroke-width="2"/>
    <text x="137" y="313" text-anchor="middle" class="sub" fill="#7C2D12">Guest OS</text>
    <text x="137" y="331" text-anchor="middle" class="small" fill="#7C2D12">(kernel sendiri, penuh)</text>

    <!-- VM2 -->
    <rect x="245" y="110" width="195" height="60" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="342" y="145" text-anchor="middle" class="sub" fill="#1E3A8A">App B</text>

    <rect x="245" y="170" width="195" height="60" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="342" y="205" text-anchor="middle" class="sub" fill="#065F46">Bins / Libs</text>

    <rect x="245" y="230" width="195" height="180" rx="6" fill="#FED7AA" stroke="#F97316" stroke-width="2"/>
    <text x="342" y="313" text-anchor="middle" class="sub" fill="#7C2D12">Guest OS</text>
    <text x="342" y="331" text-anchor="middle" class="small" fill="#7C2D12">(kernel sendiri, penuh)</text>
  </g>

  <!-- Hypervisor (virtualization boundary, VM) -->
  <rect x="40" y="410" width="400" height="50" rx="6" fill="#FCA5A5" stroke="#DC2626" stroke-width="2.5"/>
  <text x="240" y="440" text-anchor="middle" class="layer" fill="#7F1D1D">Hypervisor</text>

  <!-- Host OS -->
  <rect x="40" y="460" width="400" height="50" rx="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
  <text x="240" y="490" text-anchor="middle" class="layer" fill="#1F2937">Host OS</text>

  <!-- Infra fisik -->
  <rect x="40" y="510" width="400" height="50" rx="6" fill="#374151" stroke="#111827" stroke-width="2"/>
  <text x="240" y="540" text-anchor="middle" class="layer" fill="#FFFFFF">Infrastruktur Fisik</text>

  <!-- ===================== RIGHT: Container ===================== -->
  <!-- Empty "no guest OS" zone -->
  <rect x="480" y="110" width="195" height="180" rx="6" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="577" y="195" text-anchor="middle" class="sub" fill="#6B7280">(tidak ada</text>
  <text x="577" y="213" text-anchor="middle" class="sub" fill="#6B7280">Guest OS)</text>

  <rect x="685" y="110" width="195" height="180" rx="6" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="782" y="195" text-anchor="middle" class="sub" fill="#6B7280">(tidak ada</text>
  <text x="782" y="213" text-anchor="middle" class="sub" fill="#6B7280">Guest OS)</text>

  <!-- C1 -->
  <rect x="480" y="290" width="195" height="60" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="577" y="325" text-anchor="middle" class="sub" fill="#1E3A8A">App A</text>

  <rect x="480" y="350" width="195" height="60" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="577" y="385" text-anchor="middle" class="sub" fill="#065F46">Bins / Libs</text>

  <!-- C2 -->
  <rect x="685" y="290" width="195" height="60" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="782" y="325" text-anchor="middle" class="sub" fill="#1E3A8A">App B</text>

  <rect x="685" y="350" width="195" height="60" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
  <text x="782" y="385" text-anchor="middle" class="sub" fill="#065F46">Bins / Libs</text>

  <!-- Docker Engine (virtualization boundary, Container) -->
  <rect x="480" y="410" width="400" height="50" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
  <text x="680" y="440" text-anchor="middle" class="layer" fill="#78350F">Docker Engine (namespaces / cgroups)</text>

  <!-- Host OS (shared) -->
  <rect x="480" y="460" width="400" height="50" rx="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
  <text x="680" y="490" text-anchor="middle" class="layer" fill="#1F2937">Host OS (kernel) — dipakai bersama</text>

  <!-- Infra fisik -->
  <rect x="480" y="510" width="400" height="50" rx="6" fill="#374151" stroke="#111827" stroke-width="2"/>
  <text x="680" y="540" text-anchor="middle" class="layer" fill="#FFFFFF">Infrastruktur Fisik</text>

  <!-- ===================== Callouts ===================== -->
  <rect x="40" y="580" width="400" height="90" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <rect x="40" y="580" width="6" height="90" fill="#DC2626"/>
  <text x="56" y="602" class="callout-title" fill="#7F1D1D">VM: virtualisasi HARDWARE</text>
  <text x="56" y="622" class="callout-body">Tiap VM bawa Guest OS lengkap + kernel</text>
  <text x="56" y="639" class="callout-body">sendiri di atas hypervisor. Berat (GB),</text>
  <text x="56" y="656" class="callout-body">boot dalam hitungan menit.</text>

  <rect x="500" y="580" width="400" height="90" rx="8" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <rect x="500" y="580" width="6" height="90" fill="#D97706"/>
  <text x="516" y="602" class="callout-title" fill="#78350F">Container: virtualisasi OS/PROSES</text>
  <text x="516" y="622" class="callout-body">Semua container berbagi 1 kernel Host OS;</text>
  <text x="516" y="639" class="callout-body">yang diisolasi cuma proses/filesystem/network.</text>
  <text x="516" y="656" class="callout-body">Ringan (MB), boot dalam hitungan detik.</text>

  <text x="470" y="692" text-anchor="middle" class="foot">Kotak putus-putus = layer yang TIDAK ADA di container (tidak butuh Guest OS terpisah)</text>
</svg>
