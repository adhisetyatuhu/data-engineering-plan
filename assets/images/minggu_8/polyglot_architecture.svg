<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 740" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title    { font-size: 22px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .boxtitle { font-size: 14px; font-weight: 700; }
    .boxsub   { font-size: 10.8px; }
    .foot     { font-size: 12.5px; fill: #6B7280; }
  </style>

  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="740" fill="#FFFFFF"/>

  <text x="450" y="28" text-anchor="middle" class="title">Diagram Polyglot Architecture</text>
  <text x="450" y="48" text-anchor="middle" class="subtitle">Ilustrasi — Minggu 8, Mini Project Capstone</text>

  <!-- Raw Data -->
  <rect x="350" y="70" width="200" height="50" rx="8" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" class="boxtitle" fill="#1F2937">Raw Data</text>

  <line x1="450" y1="120" x2="450" y2="149" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- GCS -->
  <rect x="330" y="150" width="240" height="60" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5"/>
  <text x="450" y="176" text-anchor="middle" class="boxtitle" fill="#065F46">GCS (Data Lake)</text>
  <text x="450" y="194" text-anchor="middle" class="boxsub" fill="#065F46">Minggu 6 — raw CSV/Parquet</text>

  <line x1="450" y1="210" x2="450" y2="239" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Spark -->
  <rect x="330" y="240" width="240" height="60" rx="8" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
  <text x="450" y="266" text-anchor="middle" class="boxtitle" fill="#78350F">Spark Transform</text>
  <text x="450" y="284" text-anchor="middle" class="boxsub" fill="#78350F">Minggu 3 — cleaning &amp; star schema</text>

  <!-- fork -->
  <line x1="450" y1="300" x2="230" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="450" y1="300" x2="670" y2="345" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- PostgreSQL / BigQuery -->
  <rect x="100" y="350" width="260" height="95" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="230" y="378" text-anchor="middle" class="boxtitle" fill="#1E3A8A">PostgreSQL / BigQuery</text>
  <text x="230" y="397" text-anchor="middle" class="boxsub" fill="#1E3A8A">(fact_sales, dim_*)</text>
  <text x="230" y="414" text-anchor="middle" class="boxsub" fill="#1E3A8A">analitik historis · source of truth</text>

  <!-- MongoDB -->
  <rect x="540" y="350" width="260" height="95" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="670" y="378" text-anchor="middle" class="boxtitle" fill="#4C1D95">MongoDB</text>
  <text x="670" y="397" text-anchor="middle" class="boxsub" fill="#4C1D95">(products, atribut fleksibel)</text>
  <text x="670" y="414" text-anchor="middle" class="boxsub" fill="#4C1D95">katalog produk · Minggu 8</text>

  <line x1="230" y1="445" x2="230" y2="474" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Query Mahal -->
  <rect x="110" y="475" width="240" height="60" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="230" y="501" text-anchor="middle" class="boxtitle" fill="#374151">Query Mahal</text>
  <text x="230" y="519" text-anchor="middle" class="boxsub" fill="#374151">(RFM, top produk)</text>

  <line x1="230" y1="535" x2="230" y2="564" stroke="#374151" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Redis -->
  <rect x="110" y="565" width="240" height="75" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="2.5"/>
  <text x="230" y="595" text-anchor="middle" class="boxtitle" fill="#9D174D">Redis (Cache)</text>
  <text x="230" y="614" text-anchor="middle" class="boxsub" fill="#9D174D">Minggu 8 — cache hasil query, TTL 1 jam</text>

  <text x="450" y="695" text-anchor="middle" class="foot">PostgreSQL/BigQuery = source of truth  •  MongoDB = proyeksi turunan (katalog fleksibel)</text>
  <text x="450" y="715" text-anchor="middle" class="foot">Redis = cache derivatif dari query mahal, boleh sedikit basi (TTL 1 jam)</text>
</svg>
