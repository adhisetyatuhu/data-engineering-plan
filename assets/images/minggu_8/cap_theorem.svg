<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title    { font-size: 22px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6B7280; }
    .letter   { font-size: 22px; font-weight: 700; }
    .vlabel   { font-size: 14px; font-weight: 700; fill: #111827; }
    .badge    { font-size: 13px; font-weight: 700; }
    .callout-title { font-size: 13px; font-weight: 700; }
    .callout-body  { font-size: 11.8px; fill: #1F2937; }
    .foot     { font-size: 12px; fill: #6B7280; }
  </style>

  <rect x="0" y="0" width="940" height="650" fill="#FFFFFF"/>

  <text x="470" y="28" text-anchor="middle" class="title">CAP Theorem: Trade-off Sistem Terdistribusi</text>
  <text x="470" y="48" text-anchor="middle" class="subtitle">Ilustrasi — Minggu 8, Hari 1 (pilih maksimal 2 dari 3, terutama saat network partition)</text>

  <!-- Triangle wash -->
  <polygon points="470,120 270,430 670,430" fill="#F9FAFB"/>

  <!-- Edges -->
  <line x1="470" y1="120" x2="270" y2="430" stroke="#9CA3AF" stroke-width="2.5"/>
  <line x1="470" y1="120" x2="670" y2="430" stroke="#9CA3AF" stroke-width="2.5"/>
  <line x1="270" y1="430" x2="670" y2="430" stroke="#9CA3AF" stroke-width="2.5"/>

  <!-- Edge badges -->
  <rect x="347" y="262" width="46" height="26" rx="13" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="370" y="280" text-anchor="middle" class="badge" fill="#4B5563">CA</text>

  <rect x="547" y="262" width="46" height="26" rx="13" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="570" y="280" text-anchor="middle" class="badge" fill="#1E3A8A">CP</text>

  <rect x="447" y="417" width="46" height="26" rx="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
  <text x="470" y="435" text-anchor="middle" class="badge" fill="#065F46">AP</text>

  <!-- Vertices -->
  <circle cx="470" cy="120" r="32" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="470" y="129" text-anchor="middle" class="letter" fill="#1E3A8A">C</text>
  <text x="470" y="76" text-anchor="middle" class="vlabel">Consistency</text>

  <circle cx="270" cy="430" r="32" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5"/>
  <text x="270" y="439" text-anchor="middle" class="letter" fill="#065F46">A</text>
  <text x="270" y="484" text-anchor="middle" class="vlabel">Availability</text>

  <circle cx="670" cy="430" r="32" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
  <text x="670" y="439" text-anchor="middle" class="letter" fill="#78350F">P</text>
  <text x="670" y="484" text-anchor="middle" class="vlabel">Partition Tolerance</text>

  <!-- Callouts -->
  <rect x="30" y="505" width="280" height="95" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="30" y="505" width="6" height="95" fill="#9CA3AF"/>
  <text x="46" y="527" class="callout-title" fill="#374151">CA — Consistency + Availability</text>
  <text x="46" y="547" class="callout-body">Teoritis, jarang dipakai murni untuk</text>
  <text x="46" y="564" class="callout-body">sistem terdistribusi asli (mengasumsikan</text>
  <text x="46" y="581" class="callout-body">partition tidak akan terjadi).</text>

  <rect x="330" y="505" width="280" height="95" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="330" y="505" width="6" height="95" fill="#3B82F6"/>
  <text x="346" y="527" class="callout-title" fill="#1E3A8A">CP — Consistency + Partition</text>
  <text x="346" y="547" class="callout-body">Saat partisi: tolak request drpd kasih</text>
  <text x="346" y="564" class="callout-body">data tak konsisten. Cocok: transaksi</text>
  <text x="346" y="581" class="callout-body">finansial, inventori kritikal.</text>

  <rect x="630" y="505" width="280" height="95" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="630" y="505" width="6" height="95" fill="#10B981"/>
  <text x="646" y="527" class="callout-title" fill="#065F46">AP — Availability + Partition</text>
  <text x="646" y="547" class="callout-body">Saat partisi: tetap layani request,</text>
  <text x="646" y="564" class="callout-body">walau data mungkin belum ter-sinkron</text>
  <text x="646" y="581" class="callout-body">(eventual consistency). Cocok: feed sosial.</text>

  <text x="470" y="625" text-anchor="middle" class="foot">P (Partition Tolerance) wajib diasumsikan di sistem terdistribusi nyata — pertanyaannya: CP atau AP saat partition?</text>
</svg>
